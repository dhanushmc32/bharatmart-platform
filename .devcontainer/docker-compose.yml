services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bharatmart}
      MYSQL_USER: ${DB_USER:-bharatmart_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bharatmart_dev_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional RabbitMQ broker (disabled by default; enable with: docker compose --profile messaging up)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    profiles: ["messaging"]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}

volumes:
  mysql_data:
